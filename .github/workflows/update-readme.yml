name: Update README cards

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=react&hide_border=true&bg_color=1F222E&title_color=F85D7F&icon_color=F8D866
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=react&hide_border=true&bg_color=1F222E&title_color=F85D7F&icon_color=F8D866
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate YIN card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=winkt0&repo=yin_rs&theme=react&bg_color=1F222E&title_color=F85D7F&hide_border=true&icon_color=F8D866&show_icons=false
          path: profile/yin-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate biggest card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=winkt0&repo=biggest&theme=react&bg_color=1F222E&title_color=F85D7F&hide_border=true&icon_color=F8D866&show_icons=false
          path: profile/biggest-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate anyTeX card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=winkt0&repo=anyTeX&theme=react&bg_color=1F222E&title_color=F85D7F&hide_border=true&icon_color=F8D866&show_icons=false
          path: profile/anyTeX-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Rust algos card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=TheAlgorithms&repo=rust&theme=react&bg_color=1F222E&title_color=F85D7F&hide_border=true&icon_color=F8D866&show_icons=false
          path: profile/rust-algos-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate mopat card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=imi-ms&repo=MoPat&theme=react&bg_color=1F222E&title_color=F85D7F&hide_border=true&icon_color=F8D866&show_icons=false
          path: profile/mopat-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push